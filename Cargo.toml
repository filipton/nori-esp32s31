[package]
name = "nori-esp32s31"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
description = "A nori speaker on the ESP32-S31-Function-CoreBoard-1: plays what a nori cast sends it"
publish = false

# Its own workspace: it builds for the chip only (riscv32imafc-unknown-none-elf, nightly).
[workspace]

[dependencies]
esp-hal = { version = "1.2", features = ["esp32s31", "unstable"] }
esp-rtos = { version = "0.4.0", features = ["esp32s31", "embassy", "esp-radio"] }
esp-radio = { version = "1.0.0-beta.1", features = ["esp32s31", "wifi", "esp-alloc", "unstable"] }
esp-alloc = { version = "0.11.0", default-features = false, features = ["compat"] }
esp-backtrace = { version = "0.20.0", features = ["esp32s31", "panic-handler", "println"] }
esp-println = { version = "0.18.0", features = ["esp32s31", "log-04"] }
esp-bootloader-esp-idf = { version = "0.6.0", features = ["esp32s31", "log-04"] }
# Joins the saved network, or is set up over its access point or BLE until one is.
esp-hal-wifimanager = { version = "0.6.4", default-features = false, features = ["esp32s31", "ap", "ble"] }
log = "0.4.34"

embassy-executor = "0.10.0"
embassy-net = { version = "0.9.1", features = ["tcp", "udp", "dns", "multicast", "dhcpv4", "medium-ethernet", "proto-ipv4"] }
embassy-time = "0.5.1"
static_cell = "2.1.1"



serde = { version = "1", default-features = false, features = ["derive", "alloc"] }
serde_json = { version = "1", default-features = false, features = ["alloc"] }

[profile.dev]
# The radio and the audio path need it.
opt-level = 3

[profile.release]
codegen-units = 1
debug = 2
lto = "fat"
opt-level = 3

[patch.crates-io]
# `init_wm_with` (more than two sockets for the app) and BLE on the S31, until a wifimanager release has them.
esp-hal-wifimanager = { git = "https://github.com/filipton/esp-hal-wifimanager", branch = "master" }
# The ESP32-S31's I2S (esp-hal #6197) is on esp-hal's main branch only; its crates come from one commit.
esp-hal = { git = "https://github.com/esp-rs/esp-hal", rev = "5c0820cf9e2be0a49719bd71c30e7a45cae48134" }
esp-radio = { git = "https://github.com/esp-rs/esp-hal", rev = "5c0820cf9e2be0a49719bd71c30e7a45cae48134" }
esp-rtos = { git = "https://github.com/esp-rs/esp-hal", rev = "5c0820cf9e2be0a49719bd71c30e7a45cae48134" }
esp-alloc = { git = "https://github.com/esp-rs/esp-hal", rev = "5c0820cf9e2be0a49719bd71c30e7a45cae48134" }
esp-backtrace = { git = "https://github.com/esp-rs/esp-hal", rev = "5c0820cf9e2be0a49719bd71c30e7a45cae48134" }
esp-println = { git = "https://github.com/esp-rs/esp-hal", rev = "5c0820cf9e2be0a49719bd71c30e7a45cae48134" }
esp-bootloader-esp-idf = { git = "https://github.com/esp-rs/esp-hal", rev = "5c0820cf9e2be0a49719bd71c30e7a45cae48134" }
esp-storage = { git = "https://github.com/esp-rs/esp-hal", rev = "5c0820cf9e2be0a49719bd71c30e7a45cae48134" }
esp-rom-sys = { git = "https://github.com/esp-rs/esp-hal", rev = "5c0820cf9e2be0a49719bd71c30e7a45cae48134" }
esp-sync = { git = "https://github.com/esp-rs/esp-hal", rev = "5c0820cf9e2be0a49719bd71c30e7a45cae48134" }
esp-metadata-generated = { git = "https://github.com/esp-rs/esp-hal", rev = "5c0820cf9e2be0a49719bd71c30e7a45cae48134" }
esp-phy = { git = "https://github.com/esp-rs/esp-hal", rev = "5c0820cf9e2be0a49719bd71c30e7a45cae48134" }
esp-radio-rtos-driver = { git = "https://github.com/esp-rs/esp-hal", rev = "5c0820cf9e2be0a49719bd71c30e7a45cae48134" }
esp-hal-procmacros = { git = "https://github.com/esp-rs/esp-hal", rev = "5c0820cf9e2be0a49719bd71c30e7a45cae48134" }
esp-riscv-rt = { git = "https://github.com/esp-rs/esp-hal", rev = "5c0820cf9e2be0a49719bd71c30e7a45cae48134" }
esp-config = { git = "https://github.com/esp-rs/esp-hal", rev = "5c0820cf9e2be0a49719bd71c30e7a45cae48134" }
